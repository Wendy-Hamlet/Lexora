[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "lexora"
version = "0.1.0"
description = "A verifiable AI system for mapping digital-trade regulations to the RDTII framework."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Team Verbatim Trade" },
]
keywords = ["legal-ai", "rdtii", "digital-trade", "regtech", "citation", "rag"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pymupdf>=1.24",
    "rapidfuzz>=3.6",
    "rank-bm25>=0.2.2",
    "numpy>=1.26",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]
embeddings = [
    "sentence-transformers>=2.5",
    "torch>=2.2",
]
ocr = [
    "pytesseract>=0.3.10",
    "Pillow>=10.0",
]
llm = [
    "openai>=1.30",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.9",
    "types-PyYAML",
]

[project.scripts]
lexora = "lexora.cli:app"

[project.urls]
Homepage = "https://github.com/Wendy-Hamlet/Lexora"
Issues = "https://github.com/Wendy-Hamlet/Lexora/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/lexora"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# B008: Typer / FastAPI rely on call-in-default for Option/Depends.
# UP045: Typer Option type hints need `Optional[X]`, not `X | None`, on older
#        Typer versions — keep the compatible form.
ignore = ["E501", "B008", "UP045"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
