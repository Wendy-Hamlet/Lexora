# RDTII secondary-source catalogue (WS-S).
#
# Secondary sources are third-party trackers/databases that the ESCAP RDTII 2.1
# Guide says "should only serve to guide researchers to the primary sources".
# They are a DISCOVERY AID and cross-check ONLY — never scored, never cited.
#
# `indicators` lists the in-scope RDTII submission_ids the guide ATTACHES each
# source to (the per-Pillar / per-indicator "Useful secondary sources include ..."
# notes in ESCAP-RDTII-2.1-guide.pdf). It is the guide's attachment, NOT a promise
# the adapter extracts all of them: an adapter emits the SUBSET of these it can
# actually read (e.g. UNCTAD's dataset only carries a privacy + cybercrime column,
# so it informs a subset of Pillar 7). Source -> guide pages used below:
#   Pillar 6 (p.49): OECD STRI database; Linklaters, DataGuidance, Lexology, DLA Piper.
#   Pillar 7 (p.57): UNCTAD Cyberlaw Tracker; Linklaters, DataGuidance, ICLG, Lexology, DLA Piper.
#     + P7-I2 (cybersecurity, p.59): ICLG Cybersecurity Laws, Baker McKenzie Handbook,
#                                    UNCTAD Cybercrime Legislation Worldwide.
#     + P7-I5 (government access, p.61): World Map of Encryption Laws and Policies.
#   NB: the World Bank-WTO STRI is a Pillar 2/3/5 source (pp.18/24/40) — OUT of our
#   P6/P7 scope — so it is deliberately NOT listed here (reconciled 2026-06-22).
#
# `tier` orders the build effort (probe results dated 2026-06-21/22):
#   1 = free + server-rendered, easy to automate (UNCTAD tables; ICLG chapters)
#   2 = free + server-rendered but needs a per-country section parser (GP-Digital map)
#   3 = downloadable/embedded but index-not-law-name, or JS payload to parse (STRI; Linklaters)
#   4 = paywalled / 404 / anti-bot — manual-seed fallback only (DLA Piper, Lexology, Baker McKenzie, DataGuidance)
#
# BUILT adapters: unctad_* (S-1), oecd_dstri (S-3 snapshot), iclg + dla_piper (S-4),
# world_map_encryption + linklaters (free, server-rendered). NOT BUILT (paywalled /
# 404 / gated -> manual-seed fallback): lexology, baker_mckenzie, dataguidance.

sources:
  # --- Tier 1: UNCTAD (free, HTML country tables, ONE shared CyberlawData.js) -- S-1
  - key: unctad_data_protection
    name: "UNCTAD Data Protection and Privacy Legislation Worldwide"
    url: "https://unctad.org/page/data-protection-and-privacy-legislation-worldwide"
    pillars: [7]
    indicators: ["P7-I1", "P7-I4"]
    tier: 1
    notes: "Privacy column -> comprehensive data-protection framework (P7-I1); DPO/DPIA regime that lives inside it (P7-I4) is inferred. Presence only, no law name."

  - key: unctad_cyberlaw
    name: "UNCTAD Global Cyberlaw Tracker"
    url: "https://unctad.org/page/global-cyberlaw-tracker"
    pillars: [7]
    # Guide attaches the UNCTAD Cyberlaw Tracker to Pillar 7 as a whole; the dataset
    # only carries privacy + cybercrime columns, so the adapter emits P7-I1 + P7-I2.
    indicators: ["P7-I1", "P7-I2", "P7-I3", "P7-I4", "P7-I5"]
    tier: 1
    notes: "Coverage of e-transactions, consumer protection, privacy and cybercrime laws per economy. Adapter reads privacy->P7-I1 and cybercrime->P7-I2 (the columns the dataset carries)."

  - key: unctad_cybercrime
    name: "UNCTAD Cybercrime Legislation Worldwide"
    url: "https://unctad.org/page/cybercrime-legislation-worldwide"
    pillars: [7]
    # Guide names this specifically under P7-I2 (cybersecurity framework). Retention
    # (P7-I3) and government-access (P7-I5) are NOT attached by the guide — that was
    # our inference and is dropped; cybercrime presence alone does not establish them.
    indicators: ["P7-I2"]
    tier: 1
    notes: "Cybercrime law presence -> dedicated cybersecurity framework (P7-I2). NB: cybercrime statutes often carry retention/government-access provisions, but presence alone is not evidence of them, so P7-I3/P7-I5 are not claimed."

  # --- Tier 3: OECD STRI (downloadable index, P6) -- S-3 (curated snapshot) ---------
  - key: oecd_dstri
    name: "OECD Digital Services Trade Restrictiveness Index (Digital STRI)"
    url: "https://goingdigital.oecd.org/en/indicator/73"
    pillars: [6]
    indicators: ["P6-I1", "P6-I2", "P6-I3", "P6-I4"]
    tier: 3
    notes: "The OECD STRI database is the P6 secondary source named by the guide (p.49). Index, not a law name; informs presence of cross-border / localization restrictions. Curated snapshot (viz API not cleanly machine-readable)."

  # --- Law-firm / NGO trackers (P6 + P7) -- S-4 -------------------------------------
  # ICLG: BUILT (free, server-rendered, names statutes incl. AU state/territory acts).
  - key: iclg
    name: "ICLG Data Protection Laws and Regulations"
    url: "https://iclg.com/practice-areas/data-protection-laws-and-regulations"
    pillars: [7]
    # Guide lists ICLG across Pillar 7; a separate ICLG Cybersecurity guide covers P7-I2.
    indicators: ["P7-I1", "P7-I2", "P7-I3", "P7-I4", "P7-I5"]
    tier: 1
    notes: "Per-jurisdiction chapters naming the statutes (covers SG/AU; NO Malaysia chapter -> 404). Adapter (iclg_data_protection) extracts the governing act -> P7-I1/P7-I4. ICLG Cybersecurity Laws (separate guide) maps to P7-I2 — not yet wired."

  # DLA Piper: BUILT (per-country data-protection summaries naming the governing act).
  - key: dla_piper
    name: "DLA Piper Data Protection Laws of the World"
    url: "https://www.dlapiperdataprotection.com/"
    pillars: [6, 7]
    # Guide lists DLA Piper under BOTH Pillar 6 (transfer/localization) and Pillar 7.
    indicators: ["P6-I1", "P6-I2", "P6-I3", "P6-I4", "P7-I1", "P7-I2", "P7-I3", "P7-I4", "P7-I5"]
    tier: 4
    notes: "Per-country summaries naming the governing act + a Transfer section (cross-border). Adapter extracts the act -> P7-I1/P7-I4; P6/transfer parse not yet wired. Anti-bot/JS — manual-seed fallback."

  # DataGuidance: NOT BUILT — probed 2026-06-21, returns a ~6KB JS shell, real content
  # behind a subscription/JS render. Not crawlable; manual-seed fallback only.
  - key: dataguidance
    name: "OneTrust DataGuidance"
    url: "https://www.dataguidance.com/"
    pillars: [6, 7]
    indicators: ["P6-I1", "P6-I2", "P6-I3", "P6-I4", "P7-I1", "P7-I2", "P7-I3", "P7-I4", "P7-I5"]
    tier: 4
    notes: "Listed by the guide for both Pillar 6 and Pillar 7. Paywalled JS app (no server-side content); not crawlable -> manual seed only."

  # Linklaters "Data Protected": BUILT 2026-06-22. Per-jurisdiction page
  # /data-protected---<slug> server-renders the principal act (SG: PDPA 2012, AU:
  # Privacy Act 1988). Adapter extracts the act -> P7-I1/P7-I4 with a jurisdiction
  # cross-check (the ---malaysia body is mis-served as EU/Malta -> dropped, no signal).
  - key: linklaters
    name: "Linklaters Data Protected"
    url: "https://www.linklaters.com/en/insights/data-protected"
    pillars: [6, 7]
    indicators: ["P6-I1", "P6-I2", "P6-I3", "P6-I4", "P7-I1", "P7-I2", "P7-I3", "P7-I4", "P7-I5"]
    tier: 3
    notes: "Listed by the guide for Pillar 6 + Pillar 7. BUILT: per-jurisdiction page parse -> P7-I1/P7-I4, with an expected-country cross-check that drops mis-served bodies (e.g. ---malaysia renders EU/Malta). SG/AU clean; MY yields nothing."

  # Lexology / "Getting the Deal Through" (GTDT): NOT BUILT — probed 2026-06-22, HTTP 404
  # on the public GTDT path; content is paywalled. Manual-seed fallback only.
  - key: lexology
    name: "Lexology / Getting the Deal Through (GTDT)"
    url: "https://www.lexology.com/gtdt/practice-area/data-protection-privacy"
    pillars: [6, 7]
    indicators: ["P6-I1", "P6-I2", "P6-I3", "P6-I4", "P7-I1", "P7-I2", "P7-I3", "P7-I4", "P7-I5"]
    tier: 4
    notes: "Listed by the guide for Pillar 6 + Pillar 7. Public GTDT path returns 404; paywalled -> manual seed only."

  # Baker McKenzie "Global Data Privacy and Cybersecurity Handbook": NOT BUILT — probed
  # 2026-06-22, candidate resourcehub/insight URLs return HTTP 404 (gated). Manual-seed.
  - key: baker_mckenzie
    name: "Baker McKenzie Global Data Privacy and Cybersecurity Handbook"
    url: "https://www.bakermckenzie.com/"
    pillars: [7]
    indicators: ["P7-I2"]
    tier: 4
    notes: "Named by the guide specifically under P7-I2 (cybersecurity). Gated resource hub (404 on probed entry points) -> manual seed only."

  # World Map of Encryption Laws and Policies (Global Partners Digital): BUILT 2026-06-22.
  # One server-rendered page; <h4 class="h2">Country</h4> blocks split per country, prose
  # names the encryption / lawful-access laws. Adapter -> P7-I5, and (unlike the indices)
  # NAMES laws so it feeds USE-1 discovery seeds.
  - key: world_map_encryption
    name: "World Map of Encryption Laws and Policies"
    url: "https://www.gp-digital.org/world-map-of-encryption/"
    pillars: [7]
    indicators: ["P7-I5"]
    tier: 2
    notes: "Named by the guide under P7-I5 (government access to data). BUILT: single fetch + per-country section parser -> P7-I5 signals carrying law names (USE-1 seeds)."
