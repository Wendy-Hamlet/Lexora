# Malaysia — Round 1 economy (the hard one: error-checking + new-data discovery).
# Common-law based, English. Keyword keys are RDTII canonical ids (6.1..7.5).

jurisdiction: "Malaysia"
iso_code: "MY"
primary_language: "en"
additional_languages: ["ms"]
legal_system: "common"

ocr_languages: ["eng", "msa"]

# The AGC Fess back-end answers over plain HTTP with no observed rate wall, but MY
# documents are the heavy scans (one is 98 MB), so concurrency here buys OCR overlap
# rather than network overlap.
fetch_policy:
  doc_workers: 3
  min_interval: 0.5

# The official RDTII Round-1 gold inventory (configs/eval/legal_inventory_p67.csv)
# IS the known reference set for MY — every in-scope gold instrument belongs here.
# Earlier only the four flagship statutes were labelled, so the other gold laws were
# treated as NEW and squeezed out by the budget cut in discover_for_indicators
# (rest[:budget]). KNOWN floats them above the cut; they must STILL be discovered on
# the portal and verbatim-mapped — this is not a citation injection, just correct
# labelling of the supervised reference. (NEW-law discovery for unseen economies is a
# separate concern handled by the relevance judge, not by this list.)
known_instruments:
  - "Personal Data Protection Act 2010"
  - "Cyber Security Act 2024"
  - "Computer Crimes Act 1997"
  - "Communications and Multimedia Act 1998"
  - "Income Tax Act 1967"
  - "Services Tax Act 2018"
  - "Criminal Procedure Code"
  - "Security Offences (Special Measures) Act 2012"
  - "Personal Data Protection (Amendment) Act 2024"
  - "Personal Data Protection Code of Practice for Banking Sector and Financial Institutions"
  - "Personal Data Protection Code of Practice for the Communications Sector"
  - "Personal Data Protection Standard 2015"

# Act number -> canonical name, so Fess document records (filename titles) still
# tag KNOWN by identity. Keys are matched against the discovered Act number — the
# reliable lever on a full-text portal whose titles are messy PDF filenames.
known_instrument_ids:
  "709": "Personal Data Protection Act 2010"
  "854": "Cyber Security Act 2024"
  "563": "Computer Crimes Act 1997"
  "588": "Communications and Multimedia Act 1998"
  "53": "Income Tax Act 1967"
  "807": "Services Tax Act 2018"
  "593": "Criminal Procedure Code"
  "747": "Security Offences (Special Measures) Act 2012"
  "A1727": "Personal Data Protection (Amendment) Act 2024"

# Curated amendment registry (BACKSTOP — Signal C in lexora.cite.amendments). Flags a
# citation as STALE_RISK when its source pre-dates a known amendment, even if the
# amending Act was not fetched. PDPA 2010 (Act 709) was amended by the Personal Data
# Protection (Amendment) Act 2024 (Act A1727), which introduced the DPO duty (7.4) and
# data-breach notification — absent from the original 2010 text.
amended_by:
  "709":
    - by: "Act A1727"
      year: 2024

keywords_by_indicator:
  "6.1":
    en: ["transfer of personal data out of Malaysia", "Personal Data Protection Act", "Act 709"]
  "6.2":
    en: ["local storage", "stored within Malaysia", "data localization"]
  "6.4":
    en: ["transfer any personal data out of Malaysia", "conditions for transfer", "Schedule"]
  "7.1":
    # 7.1 = comprehensive data-protection framework. Target its anchor provisions by
    # statutory wording: the Personal Data Protection Principles (s.5) + the General
    # Principle's consent rule (s.6) — concept vocabulary, not the gold section nums.
    en: ["Personal Data Protection Principles", "a data user shall not process personal data unless the data subject has given his consent", "comprehensive data protection", "Act 709"]
  "7.2":
    en: ["Cyber Security Act 2024", "Act 854", "Computer Crimes Act", "Act 563"]
  "7.3":
    # 7.3 = MINIMUM retention duty. "shall not be kept longer" is a retention
    # LIMITATION (the opposite) and is excluded by classify/boundaries.py.
    en: ["minimum retention period", "retain for at least", "retention principle"]
  "7.4":
    en: ["data protection officer", "Personal Data Protection (Amendment)", "Act A1727"]
  "7.5":
    en: ["access to computerised data", "Section 116B", "intercept communication", "authorised officer"]

portals:
  - name: "Laws of Malaysia (Attorney General's Chambers)"
    url: "https://lom.agc.gov.my/"
    source_type: "primary"
    fetch_method: "api"   # Fess/Solr proxy (my_legislation_api strategy)
    search_query: "personal data protection"
    # Seconds between discovery queries. Measured 2026-08-01: a single spaced POST
    # answered 200 with a filtered result set (numFound 818, PDPA first), and the
    # 40-query sweep that started a minute later got 500 on its very first request
    # and on all 15 that followed. The proxy does not error on the query, it stops
    # answering after the burst, so the sweep is what has to slow down. 20s is a
    # first attempt, not a measured optimum: it costs ~13 min of wall time and the
    # alternative is a blind Malaysia. Lower it only against a run that stayed 200.
    sweep_interval: 20.0
    notes: "Official AGC repository. Discovered via fess-proxy.php (Fess/Solr JSON); results carry _os_url like act-detail.php?act=709 (PDPA = Act 709)."

  - name: "Personal Data Protection Department (JPDP)"
    url: "https://www.pdp.gov.my/"
    source_type: "secondary"
    fetch_method: "http"
    search_query: "code of practice"
    notes: "Sectoral codes of practice (banking, communications) — secondary unless reproducing Act 709."

  - name: "Malaysian Communications and Multimedia Commission (MCMC)"
    url: "https://www.mcmc.gov.my/"
    source_type: "secondary"
    fetch_method: "http"
    search_query: null
    notes: "Communications & Multimedia Act 1998 and related instruments."
