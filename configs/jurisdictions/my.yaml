# Malaysia — Round 1 economy (the hard one: error-checking + new-data discovery).
# Common-law based, English. Keyword keys are RDTII canonical ids (6.1..7.5).

jurisdiction: "Malaysia"
iso_code: "MY"
primary_language: "en"
additional_languages: ["ms"]
legal_system: "common"

ocr_languages: ["eng", "msa"]

known_instruments:
  - "Personal Data Protection Act 2010"
  - "Cyber Security Act 2024"
  - "Computer Crimes Act 1997"
  - "Communications and Multimedia Act 1998"

# Act number -> canonical name, so Fess document records (filename titles) still
# tag KNOWN by identity. Keys are matched against the discovered Act number.
known_instrument_ids:
  "709": "Personal Data Protection Act 2010"
  "854": "Cyber Security Act 2024"
  "563": "Computer Crimes Act 1997"
  "588": "Communications and Multimedia Act 1998"

keywords_by_indicator:
  "6.1":
    en: ["transfer of personal data out of Malaysia", "Personal Data Protection Act", "Act 709"]
  "6.2":
    en: ["local storage", "stored within Malaysia", "data localization"]
  "6.4":
    en: ["transfer any personal data out of Malaysia", "conditions for transfer", "Schedule"]
  "7.1":
    # 7.1 = comprehensive data-protection framework. Target its anchor provisions by
    # statutory wording: the Personal Data Protection Principles (s.5) + the General
    # Principle's consent rule (s.6) — concept vocabulary, not the gold section nums.
    en: ["Personal Data Protection Principles", "a data user shall not process personal data unless the data subject has given his consent", "comprehensive data protection", "Act 709"]
  "7.2":
    en: ["Cyber Security Act 2024", "Act 854", "Computer Crimes Act", "Act 563"]
  "7.3":
    # 7.3 = MINIMUM retention duty. "shall not be kept longer" is a retention
    # LIMITATION (the opposite) and is excluded by classify/boundaries.py.
    en: ["minimum retention period", "retain for at least", "retention principle"]
  "7.4":
    en: ["data protection officer", "Personal Data Protection (Amendment)", "Act A1727"]
  "7.5":
    en: ["access to computerised data", "Section 116B", "intercept communication", "authorised officer"]

portals:
