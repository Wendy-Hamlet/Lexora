# Singapore — Round 1 economy. Common-law, English.
# Keyword keys are RDTII canonical ids (6.1..7.5); see configs/rdtii_indicators.yaml.

jurisdiction: "Singapore"
iso_code: "SG"
primary_language: "en"
additional_languages: []
legal_system: "common"

ocr_languages: ["eng"]

known_instruments:
  - "Personal Data Protection Act 2012"
  - "Cybersecurity Act 2018"
  - "Computer Misuse Act"
  - "Criminal Procedure Code"

keywords_by_indicator:
  "6.1":
    en: ["transfer outside Singapore", "local processing", "ban on transfer"]
  "6.2":
    en: ["stored within Singapore", "local storage", "data localisation"]
  "6.4":
    en: ["transfer personal data to a country or territory outside Singapore", "comparable to the protection", "prescribed under this Act"]
  "7.1":
    # 7.1 = comprehensive data-protection framework. Target its two core operative
    # obligations by their statutory wording (consent to collect/use/disclose +
    # protection by reasonable security arrangements) — concept vocabulary, not the
    # gold section numbers. "data protection officer" removed: that is a 7.4 concept
    # and pulled DPO/admin sections into 7.1.
    en: ["individual gives consent to the collection, use or disclosure of personal data", "protect personal data by making reasonable security arrangements", "comprehensive personal data protection"]
  "7.2":
    en: ["Cybersecurity Act", "critical information infrastructure", "Computer Misuse Act"]
  "7.3":
    # 7.3 = MINIMUM retention duty. "cease retaining" (s.25) is a retention
    # LIMITATION (the opposite) and is excluded by classify/boundaries.py.
    en: ["minimum retention period", "retain for at least", "keep records"]
  "7.4":
    # 7.4 = designation of a data protection officer. s.11(3) wording.
    en: ["designate one or more individuals to be responsible for ensuring compliance", "data protection officer", "appoint one or more individuals"]
  "7.5":
    en: ["access to decrypted information", "Criminal Procedure Code", "power to access computers"]

portals:
  - name: "Singapore Statutes Online"
    url: "https://sso.agc.gov.sg/"
    source_type: "primary"
    fetch_method: "playwright"   # SSO returns 403 to plain clients; render to search
    search_query: "personal data protection"
    search_url_template: "https://sso.agc.gov.sg/Search/Content?Phrase={query}&PhraseType=AllWords"
    notes: "Official consolidated text of Acts and Subsidiary Legislation (AGC). Verified: discovery ranks /Act/PDPA2012 first via headless browser."

  - name: "Personal Data Protection Commission (PDPC)"
    url: "https://www.pdpc.gov.sg/"
    source_type: "secondary"
    fetch_method: "http"
    search_query: "advisory guidelines"
    notes: "Advisory guidelines — non-binding unless quoting a primary instrument."

  - name: "Cyber Security Agency of Singapore (CSA)"
    url: "https://www.csa.gov.sg/"
    source_type: "secondary"
    fetch_method: "http"
    search_query: "Cybersecurity Act"
    notes: "Discovery context for P7-I2; the primary instrument is the Cybersecurity Act 2018 on SSO."

  - name: "Infocomm Media Development Authority (IMDA)"
    url: "https://www.imda.gov.sg/"
    source_type: "secondary"
    fetch_method: "http"
    search_query: null
    notes: "Telecom licence conditions referenced under P7-I3 / P7-I5."
