# Curated STRI snapshot (WS-S, S-3) — OECD Digital STRI (the P6 secondary index).
#
# The World Bank-WTO STRI was removed on 2026-06-22: the RDTII guide places it under
# Pillars 2/3/5 (FDI/procurement/telecom), which are out of our P6/P7 scope. Pillar 6
# (p.49) names the OECD STRI database, so only OECD remains here.
#
# WHY A SNAPSHOT: the index updates ~annually and is NOT cleanly machine-fetchable —
# the OECD "goingdigital" viz API serves an opaque interleaved columnar blob (a single
# country/year/breakdown decodes to many conflicting values, so auto-extraction is
# unreliable). So values here are HUMAN-VERIFIED from the official portal.
#
# HOW TO FILL: read the figure from the source_url, then set `value` + `as_of` (year of
# the figure) + confirm `source_url`. NEVER fabricate — leave `value: null` and the
# adapter emits NOTHING for that entry (graceful skip). A value > 0 means restrictions
# exist -> a presence='yes' P6 signal (feeds the coverage cross-check + provenance only;
# NOT a discovery seed — an index carries no law name). value == 0 -> presence='no'.
#
# OECD covers AU only (SG/MY are non-members, absent from OECD STRI).

snapshots:
  - source_key: oecd_dstri
    source_name: "OECD Digital Services Trade Restrictiveness Index"
    scale: "0-1 (1 = maximum restriction)"
    indicators: ["P6-I1", "P6-I2", "P6-I3", "P6-I4"]
    economies:
      AU: { value: null, as_of: "", source_url: "https://goingdigital.oecd.org/en/indicator/73" }
      # SG, MY: not covered by OECD STRI (non-members) -> intentionally absent.
