# RDTII 2.1 indicator definitions — Pillars 6 & 7 (regulatory indicators only).
#
# Source of truth: the "RDTII 2.1 Methodology" sheet of the official
# "ESCAP-RDTII-2.1_ Round 1 Database.xlsx" and the ESCAP RDTII 2.1 Guide.
# These names/criteria are authoritative and OVERRIDE the simplified
# "Indicator Reference" tab of OUTPUT_TEMPLATE_31MAY.xlsx (whose P6/P7 names
# are inaccurate; the template's own example rows use the codes below).
#
# Code mapping: submission_id "P6-I4" == rdtii_id "6.4" (verified against the
# template example rows and the gold country data).
#
# Scope note: Pillar 6 indicator 6.5 (binding agreement commitments) is a
# NON-regulatory, third-party-sourced indicator and is out of automation
# scope; only 6.1-6.4 are covered here. Pillar 7 covers 7.1-7.5.
#
# possible_scores: 0 = no/low compliance cost ... 1 = heavily regulated.

pillars:
  - pillar: 6
    name: "Cross-border Data Policies"
    indicators:
      - submission_id: "P6-I1"
        rdtii_id: "6.1"
        name: "Ban and local processing requirements"
        description: >
          Whether the law bans the cross-border transfer of data or requires
          data to be processed locally. Exception: data localisation measures
          applied to government data are not scored.
        scoring_criteria: >
          1) Ban and/or local processing requirement for all sectors or personal
          data, OR more than one measure in category (2); 0.5) applied to a
          specific sector, specific data, non-personal data, or transfer
          prohibited to one country; 0) no requirement.
        possible_scores: [1, 0.5, 0]
        keywords:
          - "must not transfer"
          - "shall not transfer"
          - "prohibition on transfer"
          - "local processing"
          - "process within"
          - "ban on transfer"

      - submission_id: "P6-I2"
        rdtii_id: "6.2"
        name: "Local storage requirements"
        description: >
          Whether the law requires data to be stored within the territory.
          Exception: data localisation measures applied to government data are
          not scored.
        scoring_criteria: >
          1) Local storage requirement for all sectors or personal data, OR more
          than one measure in category (2); 0.5) applied to a specific sector,
          specific data or non-personal data; 0) no requirement.
        possible_scores: [1, 0.5, 0]
        keywords:
          - "local storage"
          - "store within"
          - "stored in"
          - "data localisation"
          - "retain within"
          - "kept within"

      - submission_id: "P6-I3"
        rdtii_id: "6.3"
        name: "Infrastructure requirements"
        description: >
          Whether transferring data abroad is subject to an infrastructure
          requirement or the need to establish a data centre locally.
          Exception: measures applied to government data are not scored.
        scoring_criteria: "1) Infrastructure requirement; 0) no requirement."
        possible_scores: [1, 0]
        keywords:
          - "infrastructure requirement"
          - "data centre"
          - "data center"
          - "local server"
          - "establish facilities"

      - submission_id: "P6-I4"
        rdtii_id: "6.4"
        name: "Conditional flow regimes"
        description: >
          Whether the law imposes conditions on cross-border data transfer
          (e.g. adequacy, appropriate safeguards, comparable protection, or
          individual consent). Exception: measures applied to government data
          are not scored.
        scoring_criteria: >
          1) Conditions for all sectors or personal data; 0.5) conditions for
          specific data or non-personal data; 0) no condition.
        possible_scores: [1, 0.5, 0]
        keywords:
          - "except in accordance with"
          - "conditions for transfer"
          - "appropriate safeguards"
          - "comparable to the protection"
          - "adequacy"
          - "consent to transfer"

  - pillar: 7
    name: "Domestic Data Protection & Privacy"
    indicators:
      - submission_id: "P7-I1"
        rdtii_id: "7.1"
        name: "Lack of comprehensive legal framework for data protection"
        description: >
          Whether the economy has a comprehensive (horizontal, cross-sectoral)
          personal data protection legal framework.
        scoring_criteria: >
          1) No data protection legal framework; 0.5) framework only for specific
          sectors (sectoral law); 0) comprehensive data protection framework.
        possible_scores: [1, 0.5, 0]
        keywords:
          - "personal data protection"
          - "data protection"
          - "data subject"
          - "controller"
          - "processor"
          - "consent"

      - submission_id: "P7-I2"
        rdtii_id: "7.2"
        name: "Lack of dedicated legal framework for cybersecurity"
        description: >
          Whether the economy has a dedicated cybersecurity legal framework
          (horizontal, or focused on specific sectors).
        scoring_criteria: >
          1) No cybersecurity legal framework; 0.5) non-dedicated framework
          and/or dedicated cybersecurity law for specific sectors only; 0)
          dedicated horizontal cybersecurity legal framework.
        possible_scores: [1, 0.5, 0]
        keywords:
          - "cybersecurity"
          - "critical information infrastructure"
          - "computer misuse"
          - "cybercrime"
          - "cyber security agency"

      - submission_id: "P7-I3"
        rdtii_id: "7.3"
        name: "Minimum period of data retention requirements"
        description: >
          Whether the law imposes a minimum period for retaining data.
          Exception: requirements applied to government data are not scored.
        scoring_criteria: "1) Minimum data retention requirement; 0) no requirement."
        possible_scores: [1, 0]
        keywords:
          - "retention period"
          - "retain for"
          - "keep records for"
          - "minimum period"
          - "period of retention"
          - "maintain ... records"

      - submission_id: "P7-I4"
        rdtii_id: "7.4"
        name: "Data Protection Impact Assessment (DPIA) or Data Protection Officer (DPO) requirements"
        description: >
          Whether firms are required to appoint a Data Protection Officer (DPO)
          or to conduct a Data Protection Impact Assessment (DPIA).
        scoring_criteria: >
          1) DPO and DPIA, OR DPO only, applied to all sectors; 0.5) applied to a
          specific sector; 0) no requirement.
        possible_scores: [1, 0.5, 0]
        keywords:
          - "data protection officer"
          - "appoint"
          - "data protection impact assessment"
          - "DPIA"
          - "DPO"

      - submission_id: "P7-I5"
        rdtii_id: "7.5"
        name: "Requirements to allow government access to personal data"
        description: >
          Whether measures allow the government to access personal data,
          particularly without court orders.
        scoring_criteria: >
          1) Any measure allowing government access to data without court orders;
          0) no measure.
        possible_scores: [1, 0]
        keywords:
          - "access to computerised data"
          - "lawful access"
          - "interception"
          - "without a warrant"
          - "production order"
          - "government access"
