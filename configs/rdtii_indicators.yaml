# RDTII 2.1 indicator definitions — Pillars 6 & 7 (regulatory indicators only).
#
# Source of truth: the "RDTII 2.1 Methodology" sheet of the official
# "ESCAP-RDTII-2.1_ Round 1 Database.xlsx" and the ESCAP RDTII 2.1 Guide.
# These names/criteria are authoritative and OVERRIDE the simplified
# "Indicator Reference" tab of OUTPUT_TEMPLATE_31MAY.xlsx (whose P6/P7 names
# are inaccurate; the template's own example rows use the codes below).
#
# Code mapping: submission_id "P6-I4" == rdtii_id "6.4" (verified against the
# template example rows and the gold country data).
#
# Scope note: Pillar 6 indicator 6.5 ("Not in an agreement with binding
# commitments on data transfer") is intentionally NOT covered here. The ESCAP
# RDTII 2.1 Guide explicitly classifies 6.5 as a NON-regulatory indicator whose
# data is "sourced from established third-party" databases by checking the
# economy's treaty/agreement participation status (grouped with 1.3, 2.4, 4.4,
# 4.7, 4.8, 5.6, 12.10-12.13), stating "No need to develop data-extraction
# tools". It carries no statutory provision to quote and has the lowest Pillar 6
# weight (8%). Lexora is a regulatory-provision extractor, so 6.5 is out of
# scope by design (judged elsewhere), not a gap. Covered: 6.1-6.4 and 7.1-7.5.
#
# possible_scores: 0 = no/low compliance cost ... 1 = heavily regulated.

pillars:
  - pillar: 1
    name: "Tariffs and Trade Defence"
    indicators:
      - submission_id: "P1-I4"
        rdtii_id: "1.4"
        name: "Trade defence measures including anti-dumping, countervailing duties and safeguards on ICT-related goods imported by other economies within the considered United Nations region"
        long_definition: >
          Trade defence measures including anti-dumping, countervailing duties and safeguards on
          ICT-related goods imported by other economies within the considered United Nations
          region. Official scoring criteria: 1) More than three measures 2) Three measures 3) Two
          measures 4) One measure 5) No measure (0.25 for each measure, up to 1)
        description: >
          Trade defence measures including anti-dumping, countervailing duties and safeguards on
          ICT-related goods imported by other economies within the considered United Nations
          region.
        scoring_criteria: >
          1) More than three measures 2) Three measures 3) Two measures 4) One measure 5) No
          measure (0.25 for each measure, up to 1) Possible scores: 1 / 0.75 / 0.50 / 0.25 / 0.
        possible_scores: [1, 0.75, 0.50, 0.25, 0]

  - pillar: 2
    name: "Public Procurement"
    indicators:
      - submission_id: "P2-I1"
        rdtii_id: "2.1"
        name: "Foreign exclusions from public procurement related to ICT goods and digital services"
        long_definition: >
          Foreign exclusions from public procurement related to ICT goods and digital services.
          Official scoring criteria: 1) For any legislative measure excludes foreign firms from
          public procurement under any circumstances, or more than one measure under category (2)
          2) For any legislative measure excludes a specific (group) of foreign firm(s) from
          public procurement 3) No measure (when there is only a legal basis that grants the
          government the power to exclude foreign firms)
        description: >
          Foreign exclusions from public procurement related to ICT goods and digital services.
        scoring_criteria: >
          1) For any legislative measure excludes foreign firms from public procurement under any
          circumstances, or more than one measure under category (2) 2) For any legislative
          measure excludes a specific (group) of foreign firm(s) from public procurement 3) No
          measure (when there is only a legal basis that grants the government the power to
          exclude foreign firms) Possible scores: 1 / 0.5 / 0.
        possible_scores: [1, 0.5, 0]
      - submission_id: "P2-I2"
        rdtii_id: "2.2"
        name: "Specific requirements on source codes, encryption and trade secrets"
        long_definition: >
          Specific requirements on source codes, encryption and trade secrets. Official scoring
          criteria: 1) For any requirement to surrender patents, source codes or trade secrets as
          a condition for participating in tenders 2) For any requirement to use specific
          encryption to win tenders 3) No measure
        description: >
          Specific requirements on source codes, encryption and trade secrets.
        scoring_criteria: >
          1) For any requirement to surrender patents, source codes or trade secrets as a
          condition for participating in tenders 2) For any requirement to use specific encryption
          to win tenders 3) No measure Possible scores: 1 / 0.5 / 0.
        possible_scores: [1, 0.5, 0]
      - submission_id: "P2-I3"
        rdtii_id: "2.3"
        name: "Limitations in procurement bidding"
        long_definition: >
          Limitations in procurement bidding. Official scoring criteria: 1) For any measure that
          directly discriminate against foreign bidders OR more than one measure under category
          (2) 2) For any measures measure that applies to all bidders, such as local content
          requirements and performance-based conditions 3) No measure (when there is only a legal
          basis that grants the government the power to impose limitations in procurement bidding)
        description: >
          Limitations in procurement bidding.
        scoring_criteria: >
          1) For any measure that directly discriminate against foreign bidders OR more than one
          measure under category (2) 2) For any measures measure that applies to all bidders, such
          as local content requirements and performance-based conditions 3) No measure (when there
          is only a legal basis that grants the government the power to impose limitations in
          procurement bidding) Possible scores: 1 / 0.5 / 0.
        possible_scores: [1, 0.5, 0]

